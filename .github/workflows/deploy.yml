name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Test and build client
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Verify data bundle against manifest
        run: |
          jq -r '.periods[] | "\(.sha256)  \(.file)"' data/manifest.json | (cd data && sha256sum --check --strict)
      - name: Assemble site
        run: |
          mkdir -p client/dist/data
          cp data/manifest.json data/exposure-*.json client/dist/data/
          cp deploy/_headers deploy/_redirects client/dist/
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy client/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
