  "Filter year and month, click 'Monthly Portfolio Disclosure - <Month>, <Year>'; save the xlsx into data/raw/mahindra/<YYYY-MM>/.",
]
note = "The site's API is encrypted front-end calls, so no script; the page itself works in a browser."
