name = "HDFC Mutual Fund"
method = "browser"
page = "https://www.hdfcfund.com/statutory-disclosure/portfolio/monthly-portfolio"
files = "one .xlsx per scheme (~110), links on files.hdfcfund.com"
steps = [
  "Open the page in a normal browser (scripts/curl get 403, a browser session is served normally).",
  "Click the month button (shows e.g. 'Oct - 2026'), click the month name inside it, pick the month you want.",
  "Save every link ending .xlsx on the page into data/raw/hdfc/<YYYY-MM>/ at human pace (~1 file/second).",
  "Check no file for another month slipped in (the page can keep a stale link from the previous month).",
]
note = "Each file: portfolio sheet + 0-2 'Derivative...' sheets. Futures notional comes from the Derivative sheets."
last_period = "2026-09"
last_schemes = 110

