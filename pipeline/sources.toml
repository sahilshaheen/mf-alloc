  "Download 'Consolidated SEBI Portfolio as on <month end>' (ConsolidatedSEBIPortfolio<Month><Year>.xlsx). Skip the Fortnightly ones.",
  "Save it into data/raw/kotak/<YYYY-MM>/.",
]
note = "Automated browsers get a Radware hCaptcha when the dropdown changes; a person's browser does not. Do not automate."
