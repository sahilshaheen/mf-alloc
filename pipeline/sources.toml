# Where each AMC's monthly portfolio comes from, and how to get it again next month.
# Read by `pipeline status --period YYYY-MM` and `pipeline register`. Edit this file when an AMC changes.
#
# method:
#   script   `pipeline fetch <amc> --period YYYY-MM` downloads it (fetch/<amc>.py has the page/API details)
#   browser  site refuses scripts but serves a normal browser session with no challenge; save the files from
#            a real browser (a person, or a browser session driven at human pace) into dest, then `register`
#   manual   site challenges automated browsers (captcha); a person downloads the file(s) into dest, then `register`
#   todo     not covered yet
#
# last_period / last_schemes: what the previous successful run produced; `status` flags a big drop.
# Files always go to data/raw/<amc>/<YYYY-MM>/ ; period = the month-end the portfolio is "as on".
# Portfolios are due ~10 days after month-end (SEBI), so run the month after next month's 10th.

[amfi]
name = "AMFI market-cap list and NAV file"
method = "script"
page = "https://www.amfiindia.com/otherdata/categorisation-of-stocks"
note = "Half-yearly (Jun/Dec). `fetch amfi` picks the latest list dated before the portfolio month. Needed by classify. Also fetches NAVAll.txt (scheme ISINs), needed by compute."

[sbi]
name = "SBI Mutual Fund"
method = "script"
page = "https://www.sbimf.com/portfolios"
note = "One workbook, a sheet per scheme. URL is built from the period; an 'all-scheme-' variant is tried too."
last_period = "2026-09"
last_schemes = 119

